[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-xray-classifier"
version = "0.1.0"
description = "Educational COVID-19 chest X-ray classification and shortcut audit"
requires-python = ">=3.10"
dependencies = ["tensorflow>=2.16", "numpy>=1.26", "pandas>=2.0,<2.3", "scikit-learn>=1.4", "matplotlib>=3.8", "pillow>=10.0", "openpyxl>=3.1", "pyyaml>=6.0", "kagglehub>=0.3"]

[project.scripts]
covid-xray = "covid_xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
